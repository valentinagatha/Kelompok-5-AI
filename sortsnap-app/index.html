<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SortSnap — Penyortir Foto Lokal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Library UMD globals (no import map needed) -->
  <script src="https://cdn.jsdelivr.net/npm/exifr@7/dist/full.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3/dist/jszip.min.js"></script>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <div id="app" class="max-w-7xl mx-auto px-4 py-6">
    <!-- Header -->
    <header class="mb-8 text-center">
      <h1 class="text-4xl font-bold text-indigo-600 mb-2">SortSnap</h1>
      <p class="text-slate-600">Penyortir foto & dokumen lokal. 100% di browser — tidak ada upload.</p>
    </header>

    <!-- Controls -->
    <section class="bg-white rounded-xl shadow p-6 mb-6">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-4">
        <div class="flex gap-3 flex-wrap">
          <label class="cursor-pointer inline-flex items-center px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition">
            <span>Pilih File</span>
            <input type="file" id="fileInput" multiple accept="image/*" class="hidden" />
          </label>
          <label class="cursor-pointer inline-flex items-center px-4 py-2 bg-indigo-100 text-indigo-700 rounded-lg hover:bg-indigo-200 transition">
            <span>Pilih Folder</span>
            <input type="file" id="folderInput" webkitdirectory directory multiple class="hidden" />
          </label>
        </div>
        <button id="downloadZipBtn" class="px-5 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 transition disabled:opacity-50 disabled:cursor-not-allowed" disabled>
          Download ZIP Rapi
        </button>
      </div>

      <!-- Drop Zone -->
      <div id="dropZone" class="border-2 border-dashed border-slate-300 rounded-lg p-10 text-center hover:border-indigo-400 hover:bg-indigo-50 transition">
        <p class="text-slate-500">Seret & lepas foto atau folder ke sini</p>
      </div>

      <!-- Progress -->
      <div id="progressArea" class="hidden mt-4">
        <div class="flex justify-between text-sm text-slate-600 mb-1">
          <span id="progressStage">Memuat...</span>
          <span id="progressText">0 / 0</span>
        </div>
        <div class="w-full bg-slate-200 rounded-full h-2.5">
          <div id="progressBar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>
    </section>

    <!-- Tabs -->
    <nav id="categoryTabs" class="hidden flex gap-2 mb-6 overflow-x-auto pb-2">
      <button data-tab="all" class="tab-btn px-4 py-2 rounded-full bg-indigo-600 text-white text-sm font-medium whitespace-nowrap">Semua</button>
      <button data-tab="Dokumen_&_Struk" class="tab-btn px-4 py-2 rounded-full bg-white text-slate-700 border border-slate-200 text-sm font-medium whitespace-nowrap">Dokumen & Struk</button>
      <button data-tab="Screenshot" class="tab-btn px-4 py-2 rounded-full bg-white text-slate-700 border border-slate-200 text-sm font-medium whitespace-nowrap">Screenshot</button>
      <button data-tab="Foto_Kamera" class="tab-btn px-4 py-2 rounded-full bg-white text-slate-700 border border-slate-200 text-sm font-medium whitespace-nowrap">Foto Kamera</button>
      <button data-tab="Lainnya" class="tab-btn px-4 py-2 rounded-full bg-white text-slate-700 border border-slate-200 text-sm font-medium whitespace-nowrap">Lainnya</button>
    </nav>

    <!-- Stats -->
    <div id="statsArea" class="hidden mb-4 text-sm text-slate-600">
      Total: <span id="totalCount">0</span> file
    </div>

    <!-- Gallery -->
    <main id="gallery" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
      <div id="emptyState" class="col-span-full text-center py-16 text-slate-400">
        <p>Belum ada file. Pilih file atau folder untuk mulai menyortir.</p>
      </div>
    </main>
  </div>

  <!-- Modal Preview -->
  <div id="previewModal" class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl max-w-4xl w-full max-h-[90vh] overflow-auto p-4 relative">
      <button id="closeModal" class="absolute top-3 right-3 text-slate-500 hover:text-slate-800 text-2xl leading-none">&times;</button>
      <div class="grid md:grid-cols-2 gap-4">
        <div class="flex items-center justify-center bg-slate-100 rounded-lg overflow-hidden min-h-[200px]">
          <img id="previewImage" src="" alt="Preview" class="max-w-full max-h-[70vh] object-contain" />
        </div>
        <div>
          <h3 id="previewName" class="font-semibold text-lg mb-3 break-all"></h3>
          <div id="previewMeta" class="text-sm text-slate-700 space-y-1 mb-4"></div>
          <div class="mb-4">
            <label class="block text-sm font-medium text-slate-700 mb-1">Kategori</label>
            <select id="previewCategory" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="Dokumen_&_Struk">Dokumen & Struk</option>
              <option value="Screenshot">Screenshot</option>
              <option value="Foto_Kamera">Foto Kamera</option>
              <option value="Lainnya">Lainnya</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Teks OCR</label>
            <textarea id="previewOcr" readonly class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm h-32 resize-none bg-slate-50"></textarea>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-6 right-6 px-4 py-3 rounded-lg shadow-lg text-white transform translate-y-20 opacity-0 transition-all duration-300 z-50"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
